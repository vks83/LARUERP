name: Compilation du Mod Bonelab

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4

    - name: Activer les outils de développement Visual Studio
      uses: microsoft/setup-msbuild@v2

    - name: Compiler le Mod de force
      run: |
        csc /target:library /out:ModRoles.dll /reference:LARUERP\MelonLoader.dll /reference:LARUERP\LabFusion.dll /reference:LARUERP\BoneLib.dll /reference:LARUERP\UnityEngine.CoreModule.dll LARUERP\ModRoles.cs
      shell: cmd

    - name: Sauvegarder le fichier DLL généré
      uses: actions/upload-artifact@v4
      with:
        name: Mod-Roles-Bonelab
        path: ModRoles.dll
