name: Compilation du Mod Bonelab

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4

    - name: Configurer l'environnement .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Compiler le projet automatiquement
      run: dotnet build LARUERP/ModRoles.csproj --configuration Release

    - name: Sauvegarder le fichier DLL généré
      uses: actions/upload-artifact@v4
      with:
        name: Mod-Roles-Bonelab
        path: LARUERP/bin/Release/net472/ModRoles.dll
